name: deterministic-benchmark

on:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - run: python scripts/run_reporuntime_benchmark.py
      - run: python scripts/run_policy_ablation.py
      - uses: actions/upload-artifact@v4
        with:
          name: reporuntimebench
          path: |
            artifacts/reporuntimebench-v1
            artifacts/reporuntimebench-ablation-v1
