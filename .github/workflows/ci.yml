name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e . pytest ruff
      - name: Critical lint checks
        run: ruff check pico tests scripts --select E9,F63,F7,F82
      - name: Runtime and benchmark tests
        run: >-
          python -m pytest -q
          tests/test_pico.py
          tests/test_repo_index.py
          tests/test_repo_index_v3.py
          tests/test_sandbox.py
          tests/test_subagents.py
          tests/test_task_graph.py
          tests/test_metrics.py
          tests/test_reporuntime_benchmark.py
          tests/test_policy_ablation.py
          tests/test_swebench_adapter.py
          tests/test_swebench_results.py
          tests/test_swebench_matrix.py
          tests/test_native_tool_calls.py
          tests/test_tool_protocol.py
          tests/test_v4_evidence.py
      - name: Compile source and scripts
        run: python -m compileall -q pico scripts
      - name: Security quality gate
        run: python scripts/run_security_quality.py --output artifacts/security-quality-v4.json
      - name: Deterministic RepoRuntimeBench regression
        run: python scripts/run_reporuntime_benchmark.py
      - name: Deterministic ExecutionPolicy ablation
        run: python scripts/run_policy_ablation.py
      - name: Native Tool Protocol contract benchmark
        run: python scripts/run_tool_protocol_benchmark.py
      - name: Write V4 evidence
        run: >-
          python scripts/write_v4_evidence.py
          --output artifacts/v4-ci/v4-evidence-summary.json
          --markdown-output artifacts/v4-ci/v4-evidence-summary.md
          --verification-status passed
          --verification-command "pytest, compileall, ruff and deterministic benchmark regression"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v4-ci-evidence
          path: |
            artifacts/security-quality-v4.json
            artifacts/reporuntimebench-v1
            artifacts/reporuntimebench-ablation-v1
            artifacts/tool-protocol-v1
            artifacts/v4-ci
