[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-coding-runtime"
version = "0.1.0"
description = "Evidence-driven local coding agent runtime for repository tasks"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
service = [
  "fastapi==0.115.12",
  "uvicorn==0.34.1",
  "SQLAlchemy==2.0.40",
  "psycopg[binary]==3.2.6",
  "python-dotenv==1.0.0",
]

[project.scripts]
pico = "pico.cli:main"
repo = "pico.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3.5",
  "ruff>=0.4.4",
]

[tool.setuptools.packages.find]
include = ["pico*"]

[tool.setuptools.package-data]
"pico.service" = ["workbench.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "docker: requires an explicitly enabled local Docker integration environment",
]
