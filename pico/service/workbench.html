<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Repo Runtime · 任务执行服务</title>
<style>body{margin:0;background:#f5f7fb;color:#182536;font:15px system-ui,sans-serif}main{max-width:1050px;margin:auto;padding:36px 22px}h1{font-size:30px;margin:8px 0}p{color:#63748a;line-height:1.7}section{background:white;border:1px solid #dce4ef;border-radius:12px;padding:22px;margin-top:20px}input,textarea,select,button{font:inherit;padding:10px;border:1px solid #cad6e5;border-radius:6px;box-sizing:border-box}input,textarea,select{width:100%;margin:5px 0 12px}button{cursor:pointer;background:#1969d2;color:white;margin:4px 8px 4px 0}button.secondary{background:white;color:#1969d2}table{width:100%;border-collapse:collapse}td,th{text-align:left;border-bottom:1px solid #e7edf5;padding:12px 8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;background:#f4f7fb;padding:16px;border-radius:6px}#message{color:#a43128}small{color:#63748a}.scroll{overflow-x:auto}</style></head>
<body><main><small>REPO CODING RUNTIME</small><h1>可恢复的仓库任务执行服务</h1><p>提交任务，查看执行、验证与恢复轨迹。补丁保留为产物，由你审阅后应用。</p>
<section><label>本地访问令牌<input id="token" type="password" autocomplete="off" placeholder="填写 .env.service 中的 RUNTIME_API_TOKEN"></label><button id="connect">连接服务</button><small>仅保存在当前页面会话中。</small><div id="message" role="status"></div></section>
<section><h2>新建任务</h2><label>已注册仓库<select id="repository"></select></label><label>任务描述<textarea id="task" rows="3">修复仓库中的加法函数，使其满足验证要求。</textarea></label><button id="submit">提交任务</button><small>同一次提交重试会沿用幂等键。</small></section>
<section><h2>任务与尝试</h2><button class="secondary" id="refresh">刷新列表</button><div class="scroll"><table><thead><tr><th>任务</th><th>仓库</th><th>状态</th><th>尝试</th><th>操作</th></tr></thead><tbody id="jobs"></tbody></table></div></section>
<section><h2>事件与结果</h2><small id="selection">选择任务查看持久化事件。</small><pre id="events"></pre><pre id="result"></pre></section>
</main><script>
const $=id=>document.getElementById(id);let submissionKey=null;let selected=null;let after=0;
$('token').value=sessionStorage.getItem('runtimeToken')||'';
async function api(path,options={}){const r=await fetch(path,{...options,headers:{Authorization:'Bearer '+$('token').value,'Content-Type':'application/json',...(options.headers||{})}});if(!r.ok){throw Error((await r.text()).slice(0,250));}return r.json();}
async function perform(fn){try{$('message').textContent='';await fn();}catch(e){$('message').textContent=e.message;}}
$('connect').onclick=()=>perform(async()=>{sessionStorage.setItem('runtimeToken',$('token').value);const repos=await api('/api/repositories');$('repository').replaceChildren();for(const repo of repos){const option=document.createElement('option');option.value=repo.id;option.textContent=repo.id+' · '+repo.executor;$('repository').append(option);}await refresh();});
for(const id of ['task','repository']){$(id).oninput=()=>submissionKey=null;}
$('submit').onclick=()=>perform(async()=>{submissionKey=submissionKey||crypto.randomUUID();const value=await api('/api/jobs',{method:'POST',headers:{'Idempotency-Key':submissionKey},body:JSON.stringify({repository_id:$('repository').value,task:$('task').value})});await refresh();await inspect(value.job.id);});
async function refresh(){const jobs=await api('/api/jobs');$('jobs').replaceChildren();for(const job of jobs){const row=document.createElement('tr');for(const value of [job.id.slice(0,10),job.payload.repository_id,job.state,job.generation]){const cell=document.createElement('td');cell.textContent=value;row.append(cell);}const actions=document.createElement('td');const view=document.createElement('button');view.textContent='查看';view.onclick=()=>perform(()=>inspect(job.id));actions.append(view);if(!['succeeded','failed','cancelled'].includes(job.state)){const cancel=document.createElement('button');cancel.className='secondary';cancel.textContent='取消';cancel.onclick=()=>perform(async()=>{await api('/api/jobs/'+job.id+'/cancel',{method:'POST'});await refresh();});actions.append(cancel);}row.append(actions);$('jobs').append(row);}}
async function inspect(id){if(selected!==id){selected=id;after=0;$('events').textContent='';}$('selection').textContent=id;const job=await api('/api/jobs/'+id);$('result').textContent=JSON.stringify(job,null,2);const response=await fetch('/api/jobs/'+id+'/events?follow=false&after='+after,{headers:{Authorization:'Bearer '+$('token').value}});if(!response.ok)throw Error('事件读取失败');const text=await response.text();for(const block of text.split('\n\n')){const line=block.split('\n').find(x=>x.startsWith('data: '));if(!line)continue;const event=JSON.parse(line.slice(6));after=event.seq;$('events').textContent+=event.seq+' · '+event.kind+' · attempt '+event.generation+'\n';}}
$('refresh').onclick=()=>perform(refresh);setInterval(()=>{if(selected)perform(()=>inspect(selected));},2500);
</script></body></html>
